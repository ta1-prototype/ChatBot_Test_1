
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Gemini AI Chat Studio">
  <title>Gemini Chat Studio</title>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        Gemini Studio
      </div>

      <button id="new-chat" class="new-chat">
        ＋ 新しいチャット
      </button>

      <div class="side-label">CURRENT SESSION</div>
      <div class="session-info">現在の会話</div>

      <div class="sidebar-bottom">
        <span>Powered by Gemini API</span>
        <span>Cloudflare Workers</span>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <button id="mobile-menu" aria-label="メニュー">☰</button>
        <div>
          <div class="header-title">Gemini Chat</div>
          <div class="status">
            <span class="status-dot"></span>
            AI Assistant
          </div>
        </div>
        <button id="clear-chat" class="clear-button">
          会話をクリア
        </button>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-icon">✦</div>
          <h1>何でも聞いてください。</h1>
          <p>あなたの思考をサポートするAIアシスタントです。</p>

          <div class="suggestions">
            <button class="suggestion">
              プログラミングについて教えて
            </button>
            <button class="suggestion">
              新しいアイデアを考えて
            </button>
            <button class="suggestion">
              今日のタスクを整理したい
            </button>
          </div>
        </div>
      </section>

      <div id="error" class="error"></div>

      <form id="chat-form" class="composer">
        <textarea
          id="user-input"
          placeholder="メッセージを入力..."
          rows="1"
          maxlength="20000"
        ></textarea>
        <div class="composer-footer">
          <span>Enterで送信 / Shift + Enterで改行</span>
          <button id="send-button" type="submit">↑</button>
        </div>
      </form>

      <div class="disclaimer">
        AIの回答は必ずしも正確とは限りません。
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
