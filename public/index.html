<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0e12">
  <meta name="description" content="Gemini AI Chat Studio">
  <title>Gemini Chat Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0d0e12;
      --bg-sidebar: #13141b;
      --bg-card: #1a1b26;
      --bg-input: #181924;
      --border-color: #27293a;
      --border-focus: #4b4478;
      --primary-accent: #8b5cf6;
      --primary-gradient: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%);
      --user-msg-bg: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --text-main: #f1f1f5;
      --text-muted: #8b8c9e;
      --text-dim: #5c5d6e;
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      color: var(--text-main);
      background: var(--bg-main);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; overflow: hidden; }
    button, textarea { font: inherit; cursor: pointer; }

    #app { display: flex; height: 100vh; width: 100vw; }

    .sidebar {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--primary-gradient);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: bold;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand-title { font-size: 16px; font-weight: 700; }
    .brand-sub { font-size: 11px; color: var(--text-muted); }

    .new-chat {
      background: #202230; border: 1px solid var(--border-color);
      color: var(--text-main); padding: 12px 16px; border-radius: 12px;
      text-align: left; font-weight: 600; font-size: 14px;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .new-chat:hover { background: #282a3d; border-color: #3f425c; }

    .side-label { color: var(--text-dim); font-size: 10px; font-weight: 700; margin: 32px 0 12px; letter-spacing: 1.5px; }
    .session-info {
      background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #c4b5fd; display: flex; align-items: center; gap: 8px;
    }

    .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
    .tech-tag { color: var(--text-dim); font-size: 11px; }
    .tech-tag strong { color: var(--text-muted); }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; position: relative; }

    .header {
      height: 64px; padding: 0 28px; border-bottom: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(13, 14, 18, 0.8); backdrop-filter: blur(12px);
    }
    .header-left, .header-right { display: flex; align-items: center; gap: 16px; }
    .header-title { font-weight: 700; font-size: 15px; }
    .status { color: #4ade80; font-size: 11px; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .status-dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; }
    .model-badge { background: #1e202e; border: 1px solid var(--border-color); color: var(--text-muted); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .clear-button { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 8px; padding: 6px 12px; font-size: 12px; }
    .clear-button:hover { background: #202230; color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }

    .messages { flex: 1; overflow-y: auto; padding: 32px max(20px, calc((100% - 780px) / 2)); display: flex; flex-direction: column; gap: 20px; }

    .welcome { text-align: center; margin: auto 0; padding: 40px 0; }
    .welcome-icon {
      font-size: 40px; width: 64px; height: 64px; margin: 0 auto 20px;
      background: var(--primary-gradient); border-radius: 20px;
      display: flex; align-items: center; justify-content: center; color: #fff;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
    }
    .welcome h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .welcome p { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 600px; margin: 0 auto; }
    .suggestion {
      color: #c4b5fd; background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 20px; padding: 10px 18px; font-size: 13px; transition: 0.2s;
    }
    .suggestion:hover { background: rgba(139, 92, 246, 0.18); transform: translateY(-2px); }

    .message { line-height: 1.7; font-size: 14px; white-space: pre-wrap; word-break: break-word; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .message.user {
      background: var(--user-msg-bg); color: #fff; padding: 14px 20px;
      border-radius: 18px 18px 4px 18px; align-self: flex-end; max-width: 80%;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .message.assistant {
      align-self: flex-start; width: 100%; background: var(--bg-card);
      border: 1px solid var(--border-color); padding: 18px 22px; border-radius: 18px 18px 18px 4px;
    }
    .message-header { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--primary-accent); margin-bottom: 8px; font-weight: 700; }

    .thinking-bubble { display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 13px; }
    .typing-dots { display: flex; gap: 4px; }
    .typing-dots span {
      width: 6px; height: 6px; background: var(--primary-accent); border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    .composer-container { padding: 0 20px; max-width: 820px; width: 100%; margin: 0 auto; }
    .composer { border: 1px solid var(--border-color); background: var(--bg-input); border-radius: 16px; padding: 14px 16px; }
    .composer:focus-within { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    .composer textarea { display: block; width: 100%; resize: none; background: transparent; color: var(--text-main); border: none; outline: none; min-height: 40px; max-height: 180px; }
    .composer-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); }
    .composer-footer .hint { color: var(--text-dim); font-size: 11px; }

    #send-button {
      background: var(--primary-gradient); border: none; color: #fff; border-radius: 10px;
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    }
    #send-button:disabled { opacity: 0.3; cursor: not-allowed; }

    .error { color: #fca5a5; text-align: center; font-size: 12px; padding: 6px; }
    .disclaimer { text-align: center; color: var(--text-dim); font-size: 11px; padding: 12px; }
    #mobile-menu { display: none; background: transparent; color: var(--text-main); border: none; font-size: 20px; }

    @media (max-width: 768px) {
      .sidebar { display: none; position: fixed; z-index: 100; inset: 0 auto 0 0; width: 280px; }
      .sidebar.open { display: flex; }
      #mobile-menu { display: block; }
      .model-badge { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">✦</div>
        <div class="brand-text">
          <span class="brand-title">Gemini Studio</span>
          <span class="brand-sub">AI Assistant</span>
        </div>
      </div>
      <button id="new-chat" class="new-chat">＋ 新しいチャット</button>
      <div class="side-label">CURRENT SESSION</div>
      <div class="session-info">💬 現在の会話</div>
      <div class="sidebar-bottom">
        <div class="tech-tag">Powered by <strong>Gemini API</strong></div>
        <div class="tech-tag">Cloudflare Pages</div>
      </div>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button id="mobile-menu" aria-label="メニュー">☰</button>
          <div>
            <div class="header-title">Gemini Chat</div>
            <div class="status"><span class="status-dot"></span>オンライン</div>
          </div>
        </div>
        <div class="header-right">
          <span class="model-badge">gemini-3.5-flash</span>
          <button id="clear-chat" class="clear-button">会話をクリア</button>
        </div>
      </header>

      <section id="messages" class="messages"></section>
      <div id="error" class="error"></div>

      <form id="chat-form" class="composer-container">
        <div class="composer">
          <textarea id="user-input" placeholder="メッセージを入力... (Shift+Enterで改行)" rows="1" maxlength="20000"></textarea>
          <div class="composer-footer">
            <span class="hint">Enterで送信 / Shift + Enterで改行</span>
            <button id="send-button" type="submit" aria-label="送信">↑</button>
          </div>
        </div>
      </form>
      <div class="disclaimer">Gemini may display inaccurate info, so double-check its responses.</div>
    </main>
  </div>

  <script>
    const messagesElement = document.querySelector("#messages");
    const input = document.querySelector("#user-input");
    const form = document.querySelector("#chat-form");
    const sendButton = document.querySelector("#send-button");
    const errorElement = document.querySelector("#error");

    let displayMessages = [];
    let context = [];
    let summary = "";
    let busy = false;

    function scrollBottom() {
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    function render() {
      messagesElement.replaceChildren();

      if (displayMessages.length === 0) {
        const welcome = document.createElement("div");
        welcome.className = "welcome";

        const icon = document.createElement("div");
        icon.className = "welcome-icon";
        icon.textContent = "✦";

        const title = document.createElement("h1");
        title.textContent = "何でも聞いてください。";

        const description = document.createElement("p");
        description.textContent = "あなたの思考をサポートするAIアシスタントです。";

        const suggestions = document.createElement("div");
        suggestions.className = "suggestions";

        ["プログラミングについて教えて", "新しいアイデアを考えて", "今日のタスクを整理したい"].forEach((text) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "suggestion";
          button.textContent = text;
          button.addEventListener("click", () => {
            input.value = text;
            input.focus();
          });
          suggestions.append(button);
        });

        welcome.append(icon, title, description, suggestions);
        messagesElement.append(welcome);
        return;
      }

      for (const message of displayMessages) {
        const element = document.createElement("div");
        element.className = `message ${message.role === "user" ? "user" : "assistant"}`;

        if (message.role === "model") {
          const header = document.createElement("div");
          header.className = "message-header";
          header.textContent = "✦ GEMINI";
          element.append(header);
        }

        const content = document.createElement("div");
        content.textContent = message.text;
        element.append(content);
        messagesElement.append(element);
      }

      scrollBottom();
    }

    function addMessage(role, text) {
      displayMessages.push({ id: Date.now() + displayMessages.length, role, text });
      render();
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
      input.disabled = value;
    }

    function showError(message) {
      errorElement.textContent = message;
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;

      showError("");
      addMessage("user", text);
      input.value = "";
      input.style.height = "auto";
      setBusy(true);

      const thinking = document.createElement("div");
      thinking.className = "message assistant";
      thinking.innerHTML = `
        <div class="message-header">✦ GEMINI</div>
        <div class="thinking-bubble">
          <span>Geminiが考えています</span>
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      `;
      messagesElement.append(thinking);
      scrollBottom();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, summary, history: context })
        });

        const data = await response.json();

        if (!response.ok) throw new Error(data.error || "API通信に失敗しました。");
        if (!data.reply || !Array.isArray(data.context)) throw new Error("APIから不正な応答が返されました。");

        summary = data.summary || "";
        context = data.context;

        displayMessages.push({ id: Date.now(), role: "model", text: data.reply });
        render();
      } catch (error) {
        showError(error instanceof Error ? error.message : "予期しないエラーが発生しました。");
        render();
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => { e.preventDefault(); void sendMessage(input.value); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
    });

    document.querySelector("#new-chat")?.addEventListener("click", () => {
      if (busy) return;
      displayMessages = []; context = []; summary = ""; showError(""); render();
      document.querySelector(".sidebar")?.classList.remove("open");
    });

    document.querySelector("#clear-chat")?.addEventListener("click", () => {
      if (busy) return;
      if (!confirm("現在の会話をすべて削除しますか？")) return;
      displayMessages = []; context = []; summary = ""; showError(""); render();
    });

    document.querySelector("#mobile-menu")?.addEventListener("click", () => {
      document.querySelector(".sidebar")?.classList.toggle("open");
    });

    render();
  </script>
</body>
</html>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
