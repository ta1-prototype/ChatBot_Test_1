
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Gemini AI Chat Studio">
  <title>Gemini Chat Studio</title>
</head>
<body>
  <div id="app">

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        Gemini Studio
      </div>

      <button id="new-chat" class="new-chat">
        <span>＋</span> 新しいチャット
      </button>

      <div class="side-label">WORKSPACE</div>

      <div class="session-info">
        <span class="session-dot"></span>
        現在のセッション
      </div>

      <div class="sidebar-bottom">
        <div>✦ Gemini AI</div>
        <div>Cloudflare Pages</div>
        <div class="version">Version 1.0.0</div>
      </div>
    </aside>

    <main class="main">

      <header class="header">
        <button id="mobile-menu" class="mobile-menu"
          aria-label="メニュー">☰</button>

        <div class="header-info">
          <div class="header-title">Gemini Chat</div>
          <div class="header-status">
            <span class="status-dot"></span>
            AI Assistant
          </div>
        </div>

        <button id="clear-chat" class="clear-button">
          <span>⌫</span> 会話をクリア
        </button>
      </header>

      <section id="messages" class="messages">
      </section>

      <div id="error" class="error"></div>

      <form id="chat-form" class="composer">

        <textarea
          id="user-input"
          placeholder="メッセージを入力してください..."
          rows="1"
          maxlength="20000"
          autocomplete="off"
        ></textarea>

        <div class="composer-footer">
          <span class="input-hint">
            Enterで送信 / Shift + Enterで改行
          </span>

          <button id="send-button" type="submit"
            aria-label="送信">
            ↑
          </button>
        </div>

      </form>

      <div class="disclaimer">
        AIの回答は必ずしも正確とは限りません。
      </div>

    </main>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
