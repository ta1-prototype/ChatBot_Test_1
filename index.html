    <!-- Console Warning Suppression for CDN/Babel in Browser -->
    <script>
        window.babelTransformOptions = { disableWarning: true };
        const originalWarn = console.warn;
        console.warn = function (...args) {
            if (
                typeof args[0] === 'string' && 
                (args[0].includes('in-browser Babel transformer') || args[0].includes('cdn.tailwindcss.com'))
            ) {
                return;
            }
            originalWarn.apply(console, args);
        };
    </script>
    <!-- Tailwind CSS -->

    <!-- Frontend Script Logic -->
    <script type="text/babel" data-presets="typescript">
        let chatHistory = [];
        let selectedSubject = '物理';
        let selectedBase64Image = null;

        document.addEventListener('DOMContentLoaded', () => {
            setupEventListeners();
            lucide.createIcons();
        });

        window.addEventListener('load', () => {
            setupEventListeners();
            lucide.createIcons();
        });

        function setupEventListeners() {
            const subjectSelect = document.getElementById('subjectSelect');
            if (subjectSelect) {
                subjectSelect.addEventListener('change', (e) => {
                    selectedSubject = e.target.value;
                    const badgeNode = document.getElementById('selectedSubjectBadge');
                    if (badgeNode) badgeNode.innerText = selectedSubject;
                });
            }

            const tab1Btn = document.getElementById('tab1Btn');
            const tab2Btn = document.getElementById('tab2Btn');
            const tab1Content = document.getElementById('tab1Content');
            const tab2Content = document.getElementById('tab2Content');

            if (tab1Btn && tab2Btn && tab1Content && tab2Content) {
                tab1Btn.addEventListener('click', () => {
                    tab1Btn.className = "tab-btn flex-1 flex items-center justify-center gap-2 py-3 px-5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/25";
                    tab2Btn.className = "tab-btn flex-1 flex items-center justify-center gap-2 py-3 px-5 rounded-xl text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all duration-300";
                    tab1Content.classList.remove('hidden');
                    tab2Content.classList.add('hidden');
                });

                tab2Btn.addEventListener('click', () => {
                    tab2Btn.className = "tab-btn flex-1 flex items-center justify-center gap-2 py-3 px-5 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 bg-gradient-to-r from-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-500/25";
                    tab1Btn.className = "tab-btn flex-1 flex items-center justify-center gap-2 py-3 px-5 rounded-xl text-xs sm:text-sm font-bold text-slate-400 hover:text-white transition-all duration-300";
                    tab2Content.classList.remove('hidden');
                    tab1Content.classList.add('hidden');
                });
            }

            const chatForm = document.getElementById('chatForm');
            const chatInput = document.getElementById('chatInput');

            if (chatForm && chatInput) {
                chatForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const text = chatInput.value.trim();
                    if (!text) return;
                    chatInput.value = '';
                    await handleSendMessage(text);
                });

                chatInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        chatForm.dispatchEvent(new Event('submit'));
                    }
                });
            }

            const clearChatBtn = document.getElementById('clearChatBtn');
            if (clearChatBtn) {
                clearChatBtn.addEventListener('click', () => {
                    chatHistory = [];
                    const container = document.getElementById('chatMessages');
                    if (container) {
                        container.innerHTML = `
                            <div class="flex items-start gap-3.5 max-w-3xl">
                                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 text-white flex items-center justify-center shrink-0 shadow-lg shadow-indigo-500/30">
                                    <i data-lucide="sparkles" class="w-5 h-5"></i>
                                </div>
                                <div class="glass-panel p-5 rounded-2xl rounded-tl-none border border-white/10 text-sm text-slate-200 leading-relaxed shadow-xl">
                                    <p class="font-bold mb-1 text-indigo-300">会話履歴を消去しました ✨</p>
                                    <p class="text-slate-300">新しい質問や解き方の疑問を教えてね！</p>
                                </div>
                            </div>
                        `;
                    }
                    lucide.createIcons();
                });
            }

            const dropArea = document.getElementById('dropArea');
            const imageInput = document.getElementById('imageInput');
            const removeImgBtn = document.getElementById('removeImgBtn');

            if (dropArea && imageInput && removeImgBtn) {
                dropArea.addEventListener('click', (e) => {
                    if (!removeImgBtn.contains(e.target)) imageInput.click();
                });

                imageInput.addEventListener('change', (e) => {
                    const files = e.target.files;
                    if (files && files[0]) processImageFile(files[0]);
                });

                dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('border-indigo-500'); });
                dropArea.addEventListener('dragleave', () => { dropArea.classList.remove('border-indigo-500'); });
                dropArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    dropArea.classList.remove('border-indigo-500');
                    if (e.dataTransfer && e.dataTransfer.files[0]) {
                        processImageFile(e.dataTransfer.files[0]);
                    }
                });

                removeImgBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectedBase64Image = null;
                    imageInput.value = '';
                    const placeholder = document.getElementById('uploadPlaceholder');
                    const previewContainer = document.getElementById('imagePreviewContainer');
                    if (placeholder) placeholder.classList.remove('hidden');
                    if (previewContainer) previewContainer.classList.add('hidden');
                });
            }

            const generateProblemBtn = document.getElementById('generateProblemBtn');
            if (generateProblemBtn) {
                generateProblemBtn.addEventListener('click', handleGenerateProblem);
            }
        }

        function processImageFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('画像ファイルを選択してください。');
                return;
            }
            const reader = new FileReader();
            reader.onload = (e) => {
                const result = e.target?.result;
                selectedBase64Image = {
                    mimeType: file.type,
                    data: result.split(',')[1]
                };
                const imgPreview = document.getElementById('imagePreview');
                if (imgPreview) imgPreview.src = result;
                
                const placeholder = document.getElementById('uploadPlaceholder');
                const previewContainer = document.getElementById('imagePreviewContainer');
                if (placeholder) placeholder.classList.add('hidden');
                if (previewContainer) previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function handleSendMessage(userText) {
            const sendBtn = document.getElementById('sendBtn');

            appendMessageUI('user', userText);
            chatHistory.push({ role: 'user', parts: [{ text: userText }] });

            if (sendBtn) sendBtn.disabled = true;
            const loadingBubble = appendLoadingUI();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: chatHistory
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `エラー (${response.status})`);
                }

                const data = await response.json();
                const aiText = data.text || '';

                chatHistory.push({ role: 'model', parts: [{ text: aiText }] });
                loadingBubble.remove();
                appendMessageUI('model', aiText);

            } catch (err) {
                loadingBubble.remove();
                appendMessageUI('model', `⚠️ エラーが発生しました: ${err.message}`);
            } finally {
                if (sendBtn) sendBtn.disabled = false;
            }
        }

        function appendMessageUI(role, text) {
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) return;

            const wrapper = document.createElement('div');
            const isUser = role === 'user';

            wrapper.className = `flex items-start gap-3.5 max-w-3xl ${isUser ? 'ml-auto flex-row-reverse' : ''}`;

            const iconBg = isUser 
                ? 'bg-gradient-to-tr from-purple-600 to-pink-500 shadow-purple-500/30' 
                : 'bg-gradient-to-tr from-indigo-500 to-purple-500 shadow-indigo-500/30';

            const bubbleStyle = isUser
                ? 'bg-indigo-600 text-white rounded-tr-none border-indigo-500'
                : 'glass-panel text-slate-200 rounded-tl-none border-white/10';

            wrapper.innerHTML = `
                <div class="w-9 h-9 rounded-2xl ${iconBg} text-white flex items-center justify-center shrink-0 shadow-lg text-sm mt-0.5">
                    <i data-lucide="${isUser ? 'user' : 'bot'}" class="w-5 h-5"></i>
                </div>
                <div class="markdown-body ${bubbleStyle} p-4 sm:p-5 rounded-2xl text-sm leading-relaxed shadow-xl max-w-full overflow-hidden">
                    ${marked.parse(text)}
                </div>
            `;

            chatMessages.appendChild(wrapper);
            
            const msgNode = wrapper.querySelector('.markdown-body');
            if (msgNode && window.renderMathInElement) {
                window.renderMathInElement(msgNode, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ]
                });
            }

            lucide.createIcons();
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendLoadingUI() {
            const chatMessages = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-start gap-3.5 max-w-3xl';
            wrapper.innerHTML = `
                <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 text-white flex items-center justify-center shrink-0 shadow-lg shadow-indigo-500/30">
                    <i data-lucide="bot" class="w-5 h-5"></i>
                </div>
                <div class="glass-panel border border-white/10 px-5 py-4 rounded-2xl rounded-tl-none text-sm text-slate-400 flex items-center gap-3">
                    <div class="flex gap-1.5">
                        <div class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce"></div>
                        <div class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce [animation-delay:-0.15s]"></div>
                        <div class="w-2 h-2 rounded-full bg-indigo-400 animate-bounce [animation-delay:-0.3s]"></div>
                    </div>
                    <span class="text-xs font-semibold text-slate-400">思考・解答を作成中...</span>
                </div>
            `;
            chatMessages.appendChild(wrapper);
            lucide.createIcons();
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return wrapper;
        }

        async function handleGenerateProblem() {
            if (!selectedBase64Image) {
                alert('解析用の画像をアップロードしてください。');
                return;
            }

            const contextNote = document.getElementById('imageContextInput')?.value.trim() || '';
            const emptyState = document.getElementById('outputEmptyState');
            const loadingState = document.getElementById('outputLoadingState');
            const resultContainer = document.getElementById('outputResultContainer');
            const resultMarkdown = document.getElementById('outputMarkdown');
            const generateBtn = document.getElementById('generateProblemBtn');

            if (emptyState) emptyState.classList.add('hidden');
            if (resultContainer) resultContainer.classList.add('hidden');
            if (loadingState) loadingState.classList.remove('hidden');
            if (generateBtn) generateBtn.disabled = true;

            try {
                const response = await fetch('/api/generate-problem', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        subject: selectedSubject,
                        contextNote: contextNote,
                        image: selectedBase64Image
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `エラー (${response.status})`);
                }

                const data = await response.json();
                const responseText = data.text || '';

                if (resultMarkdown) {
                    resultMarkdown.innerHTML = marked.parse(responseText);
                    
                    if (window.renderMathInElement) {
                        window.renderMathInElement(resultMarkdown, {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false}
                            ]
                        });
                    }
                }

                if (loadingState) loadingState.classList.add('hidden');
                if (resultContainer) resultContainer.classList.remove('hidden');

            } catch (err) {
                if (loadingState) loadingState.classList.add('hidden');
                if (emptyState) emptyState.classList.remove('hidden');
                alert(`生成に失敗しました: ${err.message}`);
            } finally {
                if (generateBtn) generateBtn.disabled = false;
            }
        }
    </script>
</body>
